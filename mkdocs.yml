site_name: C# & .NET for Mere Mortals
site_description: Microsoft's language and the platform under it, from an empty machine to a finished program. Installing the free .NET SDK, building a console tool that analyses a stock file with LINQ, testing its sums with xUnit and an independent cross-check, and publishing a folder anyone can run, with the limits stated plainly.
site_url: https://paulsullivan33-dev.github.io/csharp-and-dotnet-for-mere-mortals/
